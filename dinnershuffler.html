<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner Shuffler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }
        textarea {
            width: 100%;
            height: 200px;
        }
        button {
            margin-top: 10px;
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Dinner Shuffler</h1>
    <p>Enter or paste a list of dinners, one dinner per line:</p>
    <textarea id="dinnerInput"></textarea>
    <!-- The above button will run the generatePlan() function-->> 
    <br> 
    <button onclick="generatePlan()">Shuffle Dinners</button>
    <h2>Result</h2>
    <ul id="output"></ul>
    <!-- The empty ul will populate with shuffled dinners--> 

    <script>
        function shuffle(array) {
            // Start at end of array 
            for (let i = array.length - 1; i > 0; i--) {
                /*
                Math.random() generates a random number between 0 and 1.
                The random number is multiplied by (i+1) so that the number is between 0 and i. 
                Math.floor() rounds it down to a whole number.
                */
                const j = Math.floor(Math.random() * (i + 1));
                // Swaps items at positions i and j. 
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        function generatePlan() {
            // Get the user input from textarea
            const input = document.getElementById("dinnerInput").value;
            /* Convert text into an array
            Step 1 breaks the text apart at each new line
            Step 2 trims extra spaces from the beginning/end of each line
            Step 3 removes empty lines
            */
            let dinners = input
                .split("\n")
                .map(d => d.trim())
                .filter(d => d.length > 0);
            
            // If nothing was entered:
            if (dinners.length === 0) {
                alert("Sadly, no dinners were entered.");
                return; // exit the function
            }
            /* Shuffle the dinners:
            [...dinners] is used to make a copy of the array to prevent the original list from being modified.
            */
            const shuffled = shuffle([...dinners]);
            // Find the <ul> where the results should be displayed:
            const output = document.getElementById("output");
            // Clear out prevous results:
            output.innerHTML = "";
            // Loop through each dinner in shuffled list.  forEach runs for every item in the array.
            shuffled.forEach((dinner, index) => {
                const li = document.createElement("li");
                // Set the text content of the new li.  Changing index from 0 to 1 for human friendliness.
                li.textContent = `Day ${index + 1}: ${dinner}`;
                // Add the <li> to the <ul> on the page
                    output.appendChild(li);

            });
        }
    </script>
</body>
</html>
